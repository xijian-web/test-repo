<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>36 家客户商业画像 · 全屏铺满翻页册</title>
<style>
:root{
  --navy:#1F3864; --blue:#2E5496; --ink:#26303D; --ink2:#4A5566; --gray:#8A94A6;
  --line:#DCE3EF; --bg:#E9EDF5; --card:#F5F8FC; --red:#C00000; --orange:#C55A11;
  --pw:1680px; --ph:945px; --padx:72px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:
    radial-gradient(1200px 700px at 50% -10%,#F6F8FC 0%,#E4E9F2 45%,#D7DEEA 100%);
  font-family:"Source Han Sans SC","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);overflow:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
/* ---------------- 舞台 ---------------- */
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:2600px;z-index:0}
#book{
  width:var(--pw);height:var(--ph);position:relative;
  transform-origin:center center;
  transform-style:preserve-3d;
  filter:drop-shadow(0 26px 60px rgba(20,35,64,.28));
}
.page{
  position:absolute;inset:0;background:#fff;border-radius:2px;
  display:none;overflow:hidden;
  transform-origin:left center;backface-visibility:hidden;
}
.page.on{display:block}
.page::after{ /* 装订侧阴影 */
  content:"";position:absolute;left:0;top:0;bottom:0;width:14px;
  background:linear-gradient(90deg,rgba(20,35,64,.10),rgba(20,35,64,0));pointer-events:none;
}
.page.flip-out{display:block;z-index:40;animation:flipOut .62s cubic-bezier(.42,.02,.28,1) forwards}
.page.flip-out::before{
  content:"";position:absolute;inset:0;z-index:5;pointer-events:none;
  background:linear-gradient(90deg,rgba(20,30,50,.55),rgba(20,30,50,.05) 55%,rgba(20,30,50,0));
  animation:shadeOut .62s forwards;
}
@keyframes flipOut{
  0%{transform:rotateY(0deg)}
  100%{transform:rotateY(-176deg)}
}
@keyframes shadeOut{0%{opacity:0}55%{opacity:.55}100%{opacity:.9}}
.page.flip-in{display:block;z-index:40;animation:flipIn .62s cubic-bezier(.42,.02,.28,1) forwards}
@keyframes flipIn{0%{transform:rotateY(-176deg)}100%{transform:rotateY(0deg)}}

/* ---------------- 页眉页脚 ---------------- */
.pg-head{
  position:absolute;top:0;left:var(--padx);right:var(--padx);height:48px;
  display:flex;align-items:flex-end;justify-content:space-between;
  padding-bottom:7px;border-bottom:1px solid var(--line);
  font-size:12.5px;letter-spacing:.06em;color:var(--gray);
}
.pg-head b{font-weight:600;color:var(--navy)}
.pg-body{
  position:absolute;top:48px;left:var(--padx);right:var(--padx);
  height:851px;overflow:hidden;
}
.pg-foot{
  position:absolute;bottom:0;left:var(--padx);right:var(--padx);height:46px;
  display:flex;align-items:center;justify-content:space-between;
  font-size:12.5px;color:var(--gray);letter-spacing:.04em;
  border-top:1px solid var(--line);padding-top:8px;
}
.pg-foot .pn b{color:var(--navy);font-weight:700;font-size:11px}
.ribbon{position:absolute;left:0;top:0;bottom:0;width:5px}

/* ---------------- 正文排版 ---------------- */
.pg-flow{font-size:18px;line-height:1.72;color:var(--ink);text-align:justify}
.sec-title{
  font-size:20px;font-weight:700;color:var(--navy);letter-spacing:.02em;
  margin:22px 0 10px;padding-left:13px;position:relative;line-height:1.4;
}
.sec-title::before{
  content:"";position:absolute;left:0;top:3px;width:4px;height:17px;border-radius:2px;
  background:linear-gradient(180deg,var(--navy),var(--blue));
}
.sec-title.first{margin-top:0}
.blk{margin:0 0 9px}
p{margin:0 0 8px}
ul,ol{margin:0 0 9px;padding-left:0;list-style:none}
li{position:relative;padding-left:18px;margin:0 0 6px}
ul>li::before{
  content:"";position:absolute;left:2px;top:.72em;width:5px;height:5px;border-radius:50%;
  background:var(--blue);opacity:.55;
}
ol{counter-reset:o}
ol>li{counter-increment:o;padding-left:24px}
ol>li::before{
  content:counter(o)".";position:absolute;left:0;top:0;color:var(--blue);
  font-weight:700;font-size:12.5px;line-height:1.9;
}
strong{font-weight:700;color:#15243D}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15.5px;background:#F1F4FA;padding:1px 4px;border-radius:3px}
.mk{font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;font-style:normal}

.callout{
  background:var(--card);border-left:3px solid var(--blue);border-radius:0 4px 4px 0;
  padding:12px 16px;margin:0 0 13px;font-size:17px;line-height:1.74;color:#33405A;
}
blockquote.qt{
  margin:0 0 10px;padding:8px 14px;background:#FAFBFE;border-left:2px solid var(--line);
  color:var(--ink2);font-size:16.5px;
}
table.tbl{width:100%;border-collapse:collapse;margin:0 0 12px;font-size:15px;line-height:1.6;table-layout:auto}
table.tbl th{
  background:var(--navy);color:#fff;font-weight:600;text-align:left;
  padding:6px 7px;border:1px solid #172B4E;letter-spacing:.02em;
}
table.tbl td{padding:5px 7px;border:1px solid var(--line);vertical-align:top;word-break:break-word}
table.tbl tbody tr:nth-child(even){background:#F7F9FD}
table.tbl tbody tr:hover{background:#EEF3FB}
.src{font-size:13px;color:#8A94A6;line-height:1.7;border-top:1px solid var(--line);padding-top:8px;margin-top:10px}

/* 跟进轨迹独立页 */
.track-tbl th{white-space:nowrap}
.track-tbl td:last-child{width:30%}
tr.add-row td{background:#FBFCFF}
tr.add-row td.last{position:relative;padding-right:20px}
tr.add-row td .cell{display:block;min-height:1.2em;outline:1px dashed transparent;border-radius:3px;cursor:text}
tr.add-row td .cell:hover{outline-color:#9CBBE8;background:#FCFDFF}
tr.add-row td .cell:focus{outline:1.5px solid #3A6BB5;background:#FBFDFF}
.delx{
  position:absolute;right:2px;top:50%;transform:translateY(-50%);
  width:15px;height:15px;line-height:13px;text-align:center;border-radius:50%;
  background:#FDECEC;color:#C00000;font-size:11px;font-weight:700;cursor:pointer;user-select:none;
}
.delx:hover{background:#C00000;color:#fff}
.tbl tbody td:last-child{position:relative;padding-right:22px}
.delx{opacity:0;transition:opacity .12s}
.tbl tbody tr:hover .delx{opacity:1}
.tbl td.empty-hint{color:#98A3B8;text-align:center;font-size:13.5px;letter-spacing:.05em}
.pgdel{font-size:11px;color:#C00000;cursor:pointer;border:1px solid #E5B4B4;border-radius:5px;padding:2px 8px;background:#fff;letter-spacing:.04em;user-select:none}
.pgdel:hover{background:#C00000;color:#fff}
.track-tools{display:flex;align-items:center;gap:12px;margin:4px 0 2px}
.addrow-btn{
  border:1px solid var(--blue);background:#fff;color:var(--navy);
  font-family:inherit;font-size:12.5px;font-weight:700;padding:4px 14px;border-radius:6px;
  cursor:pointer;letter-spacing:.06em;
}
.addrow-btn:hover{background:#EDF2FA}
.addrow-hint{font-size:11px;color:var(--gray);letter-spacing:.02em}
.hl-red{color:var(--red);font-weight:600}

/* 客户首页顶栏 */
.cust-banner{margin:0 0 16px;padding-bottom:12px;border-bottom:2px solid var(--navy)}
.cust-kicker{font-size:12px;letter-spacing:.22em;color:var(--gray);text-transform:uppercase;margin-bottom:6px}
.cust-name{font-size:36px;font-weight:800;color:var(--navy);letter-spacing:.01em;line-height:1.2}
.cust-sub{font-size:13.5px;color:var(--ink2);margin-top:7px}
.cust-sub span{display:inline-block;margin-right:14px}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11.5px;font-weight:700;color:#fff;letter-spacing:.04em}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0 5px}
.card{background:var(--card);border:1px solid #E3EAF6;border-radius:5px;padding:9px 11px}
.card .k{font-size:12px;color:var(--gray);letter-spacing:.05em}
.card .v{font-size:15px;font-weight:600;color:#1B2A44;margin-top:3px}

/* 首页信息卡：常驻可编辑窗口 */
.editable-field{
  outline:1px dashed transparent;border-radius:3px;cursor:text;min-height:1.3em;
  transition:outline-color .15s,background .15s;
}
.editable-field:hover{outline-color:#9CBBE8;background:#FCFDFF}
.editable-field:focus{outline:1.5px solid #3A6BB5;background:#FBFDFF}

/* 四页模板：非首页的客户窄条 + 子标题 */
.cust-strip{display:flex;align-items:center;gap:10px;margin:0 0 2px;padding-bottom:9px;border-bottom:2px solid var(--navy)}
.cust-strip .cs-no{font-size:11.5px;font-weight:800;color:#fff;background:var(--navy);border-radius:4px;padding:2px 7px;letter-spacing:.06em}
.cust-strip .cs-nm{font-size:20px;font-weight:800;color:var(--navy);letter-spacing:.01em}
.cust-strip .cs-cat{margin-left:auto;font-size:12px;color:var(--gray);letter-spacing:.16em}
.sub-h{font-size:14.5px;font-weight:700;color:var(--blue);margin:14px 0 7px;padding-left:10px;position:relative;letter-spacing:.02em}
.sub-h::before{content:"";position:absolute;left:0;top:4px;width:3px;height:13px;border-radius:2px;background:var(--blue);opacity:.75}

/* 目录 */
.toc-h{font-size:28px;font-weight:800;color:var(--navy);letter-spacing:.04em;margin:6px 0 2px}
.toc-s{font-size:12px;letter-spacing:.24em;color:var(--gray);margin-bottom:20px}
.toc-row{display:flex;align-items:baseline;gap:0;padding:9px 4px;border-bottom:1px dashed #E4EAF4;cursor:pointer;border-radius:3px}
.toc-row:hover{background:#F2F6FC}
.toc-no{width:30px;font-size:11.5px;color:var(--gray);font-variant-numeric:tabular-nums}
.toc-name{font-size:15px;font-weight:600;color:#1B2A44;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toc-dot{flex:1;border-bottom:1px dotted #C9D4E6;margin:0 8px;transform:translateY(-3px)}
.toc-pg{font-size:12.5px;color:var(--navy);font-weight:700;font-variant-numeric:tabular-nums;width:26px;text-align:right}
.toc-tier{width:16px;text-align:center;font-size:9px;font-weight:800;margin-right:2px}

/* ---------------- 工具条 ---------------- */
#bar{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  display:flex;align-items:center;gap:6px;padding:7px 10px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px) saturate(160%);
  border:1px solid rgba(31,56,100,.12);border-radius:14px;
  box-shadow:0 10px 34px rgba(20,35,64,.16);z-index:200;font-size:12px;
}
#bar button{
  border:0;background:transparent;color:#2B3A55;font-size:12px;font-family:inherit;
  padding:6px 9px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:.15s;
}
#bar button:hover{background:#EDF2FA;color:var(--navy)}
#bar button.pri{background:var(--navy);color:#fff}
#bar button.pri:hover{background:#16294A}
#bar button.act{background:#E7EEFA;color:var(--navy);box-shadow:inset 0 0 0 1px #C9D8EF}
#bar .sep{width:1px;height:20px;background:#E1E7F1;margin:0 3px}
#bar .pgn{font-variant-numeric:tabular-nums;color:#4A5566;min-width:76px;text-align:center;font-size:11.5px}
#bar input[type=range]{width:120px;accent-color:var(--navy)}
#bar select{
  border:1px solid #DFE6F1;background:#fff;border-radius:8px;padding:5px 6px;
  font-size:11.5px;font-family:inherit;color:#2B3A55;max-width:170px;
}
/* 全屏阅读：工具条闲置自动隐藏 */
#bar{transition:opacity .45s ease, transform .45s ease}
body.barhide #bar{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(18px)}
#hint{
  position:fixed;left:50%;bottom:82px;transform:translateX(-50%);
  background:rgba(31,56,100,.92);color:#fff;font-size:12px;padding:8px 16px;border-radius:20px;
  opacity:0;pointer-events:none;transition:.3s;z-index:210;
}
#hint.show{opacity:1}
#toast{
  position:fixed;right:22px;top:22px;background:rgba(31,56,100,.95);color:#fff;font-size:12px;
  padding:10px 16px;border-radius:10px;opacity:0;transform:translateY(-6px);transition:.25s;z-index:220;
}
#toast.show{opacity:1;transform:none}

/* 编辑态 */
body.editing .page.on [data-eid]{outline:1px dashed transparent;border-radius:3px;transition:outline-color .15s}
body.editing .page.on [data-eid]:hover{outline-color:#9CBBE8;background:#FCFDFF}
body.editing .page.on [data-eid]:focus{outline:1.5px solid #3A6BB5;background:#FBFDFF}
body.editing #editFlag{display:inline-flex}
#editFlag{display:none;align-items:center;gap:5px;font-size:10.5px;color:#C00000;font-weight:700;letter-spacing:.04em}
#editFlag i{width:6px;height:6px;border-radius:50%;background:#C00000;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* 字体格式工具条（编辑模式显示） */
#fmt{
  position:fixed;left:50%;bottom:76px;transform:translateX(-50%);
  display:none;align-items:center;gap:6px;padding:6px 10px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(14px) saturate(160%);
  border:1px solid rgba(31,56,100,.12);border-radius:12px;
  box-shadow:0 10px 30px rgba(20,35,64,.16);z-index:200;font-size:12px;
  transition:opacity .45s ease;
}
body.editing #fmt{display:flex}
body.barhide #fmt{opacity:0;pointer-events:none}
#fmt label{font-size:11px;color:#4A5566;white-space:nowrap}
#fmt select{
  border:1px solid #DFE6F1;background:#fff;border-radius:8px;padding:4px 5px;
  font-size:11.5px;font-family:inherit;color:#2B3A55;
}
#fmt input[type=color]{
  width:28px;height:24px;border:1px solid #DFE6F1;border-radius:6px;
  padding:1px;background:#fff;cursor:pointer;
}
#fmt button{
  border:1px solid #DFE6F1;background:#fff;color:#2B3A55;font-size:11.5px;
  font-family:inherit;padding:4px 9px;border-radius:8px;cursor:pointer;font-weight:700;white-space:nowrap;
}
#fmt button:hover{background:#EDF2FA;color:var(--navy)}
#fmt .fhint{font-size:10.5px;color:#98A3B8;white-space:nowrap}

/* ============ 主页总览表 + 7日提醒 ============ */
.ov-h{display:flex;align-items:baseline;gap:14px;margin:2px 0 10px}
.ov-t{font-size:30px;font-weight:800;color:var(--navy);letter-spacing:.04em}
.ov-sum{font-size:14px;color:var(--ink2)}
table.ov{width:100%;border-collapse:collapse;font-size:14px;line-height:1.55;table-layout:fixed}
table.ov th{background:var(--navy);color:#fff;font-weight:600;text-align:left;padding:6px 8px;border:1px solid #172B4E;letter-spacing:.02em;font-size:14px}
table.ov td{padding:5px 8px;border:1px solid var(--line);vertical-align:top;word-break:break-word;overflow:hidden}
table.ov tbody tr:nth-child(even){background:#F7F9FD}
table.ov tr.due-red td{background:#FCEDEC}
table.ov .editable-field{display:block;min-height:1.2em}
.ov-link{cursor:pointer;color:var(--navy);border-bottom:1px dashed rgba(31,56,100,.45)}
.ov-link:hover{color:#C00000;border-bottom-color:#C00000}
.rem-red{color:var(--red);font-weight:700}
.rem-ok{color:#1E7B34;font-weight:600}
.rem-gray{color:#98A3B8}
.rem-blue{color:#2E5496;font-weight:600}
.rem-badge{display:inline-block;min-width:14px;text-align:center;background:#C00000;color:#fff;border-radius:8px;font-size:10px;line-height:14px;padding:0 4px;margin-left:3px;font-weight:700}
#remPanel{
  position:fixed;right:22px;top:58px;width:340px;max-height:72vh;overflow:auto;
  background:rgba(255,255,255,.98);border:1px solid rgba(31,56,100,.15);border-radius:12px;
  box-shadow:0 14px 40px rgba(20,35,64,.24);padding:14px 14px 10px;z-index:230;display:none;font-size:12px;
}
#remPanel.show{display:block}
#remPanel h4{margin:0 0 4px;color:var(--navy);font-size:13.5px;display:flex;align-items:center;justify-content:space-between}
#remPanel .rp-sub{font-size:11px;color:var(--gray);margin-bottom:8px}
.rem-item{display:flex;align-items:center;gap:8px;padding:6px;border-bottom:1px dashed #E4EAF4;cursor:pointer;border-radius:6px}
.rem-item:hover{background:#F2F6FC}
.rem-item .rn{font-weight:700;color:#1B2A44}
.rem-item .rc{color:var(--gray);font-size:11px}
.rem-item .rd{margin-left:auto;color:var(--red);font-weight:700;white-space:nowrap}

/* ============ 每日全网追新 ============ */
#newsPanel{
  position:fixed;right:22px;top:58px;width:470px;max-height:76vh;overflow:auto;
  background:rgba(255,255,255,.98);border:1px solid rgba(31,56,100,.15);border-radius:12px;
  box-shadow:0 14px 40px rgba(20,35,64,.24);padding:14px 14px 10px;z-index:230;display:none;font-size:12px;
}
#newsPanel.show{display:block}
#newsPanel h4{margin:0 0 4px;color:var(--navy);font-size:13.5px;display:flex;align-items:center;justify-content:space-between}
#newsPanel .rp-sub{font-size:11px;color:var(--gray);margin-bottom:8px;line-height:1.6}
.news-cust{margin-bottom:8px}
.nc-head{display:flex;align-items:center;padding:5px 8px;background:#F2F6FC;border-radius:6px;cursor:pointer}
.nc-head:hover{background:#E7EEFA}
.nc-head .rn{font-weight:700;color:#1B2A44;font-size:12.5px}
.nc-head .rd{margin-left:auto;color:var(--navy);font-weight:700;font-size:11px}
.n-fresh{
  display:inline-block;background:var(--red);color:#fff;border-radius:8px;
  font-size:9.5px;line-height:14px;padding:0 4px;font-weight:700;flex:none;margin-top:1px;
}
.n-date{color:var(--navy);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:11px;margin-top:1px}
.n-tag{flex:none;padding:0 5px;border-radius:8px;font-size:10px;font-weight:700;color:#fff;margin-top:1px}
.n-tt{flex:1;color:#1B2A44}
.n-link{flex:none;color:#2E5496;text-decoration:none;border-bottom:1px dashed rgba(46,84,150,.5);white-space:nowrap;font-size:11px}
.n-link:hover{color:var(--red);border-bottom-color:var(--red)}
.news-row{display:flex;align-items:flex-start;gap:5px;padding:5px 4px 5px 8px;border-bottom:1px dashed #E4EAF4;line-height:1.5}
.news-row.fresh{background:#FFF9F7}
.news-item{
  position:relative;padding:5px 9px;margin:0 0 6px;
  background:#F7FAFF;border:1px solid #E3EAF6;border-left:3px solid var(--blue);
  border-radius:4px;font-size:15px;line-height:1.6;
}
.news-item.fresh{border-left-color:var(--red);background:#FFF9F7}
.news-item .n-date{font-size:12px;margin-right:6px}
.news-item .n-tag{padding:0 6px;border-radius:9px;font-size:10.5px;margin-right:6px}
.news-item .n-tt{font-weight:600;color:#1B2A44}
.news-item .n-src{margin-left:8px;font-size:12.5px}
.news-item .n-src a{color:#2E5496;text-decoration:none;border-bottom:1px dashed rgba(46,84,150,.5)}
.news-item .n-src a:hover{color:var(--red);border-bottom-color:var(--red)}
.news-item .n-sum{margin-top:3px;font-size:13.5px;color:var(--ink2);line-height:1.65}

/* ---------------- 打印 ---------------- */
@media print{
  @page{size:A4 landscape;margin:0}
  html,body{overflow:visible;background:#fff;height:auto}
  #bar,#hint,#toast,#remPanel,#newsPanel,#fmt{display:none!important}
  #measure{display:none!important}
  #stage{position:static;display:block;perspective:none}
  #book{transform:none!important;filter:none;zoom:.665;width:1680px;height:945px}
  .page{
    display:block!important;position:relative!important;inset:auto;
    width:1680px;height:944.5px;page-break-after:always;break-after:page;
    animation:none!important;transform:none!important;box-shadow:none;border-radius:0;
  }
  .page::after{display:none}
  .track-tools{display:none!important}
  .delx{display:none!important}
  .pgdel{display:none!important}
  tr.add-row td .cell{outline:none!important}
}
</style>
</head>
<body>

<div id="stage"><div id="book"></div></div>

<div id="bar">
  <button id="btnPrev" title="上一页 ←">‹</button>
  <span class="pgn" id="pgn">– / –</span>
  <button id="btnNext" title="下一页 →">›</button>
  <input type="range" id="slider" min="0" max="0" value="0">
  <span class="sep"></span>

/* ============ 常量 ============ */
const W = 1680, H = 945, PADX = 72, BODY_H = 851;
const CONTENT_W = W - PADX * 2;
const EDIT_KEY = 'booklet-edits-v1';
const META_KEY = 'booklet-meta-v1';
const LEGACY_TRACK_KEY = 'booklet-track-v1';  // 旧版：仅轨迹增行（已并入 TBL_KEY）
const TBL_KEY = 'booklet-tables-v1';          // 全表格：增行 / 删行 / 用户附表页
const STYLE_KEY = 'booklet-styles-v1';        // 整块级字体格式（字号/字体/颜色等）

let edits = {};
try { edits = JSON.parse(localStorage.getItem(EDIT_KEY) || '{}'); } catch (e) { edits = {}; }

let styles = {};
try { styles = JSON.parse(localStorage.getItem(STYLE_KEY) || '{}'); } catch (e) { styles = {}; }
function saveStyles() {
  try { localStorage.setItem(STYLE_KEY, JSON.stringify(styles)); } catch (err) {}
}

let tblState = { rows: {}, del: {}, pages: {}, seq: 0 };
try {
  tblState = Object.assign({ rows: {}, del: {}, pages: {}, seq: 0 },
    JSON.parse(localStorage.getItem(TBL_KEY) || '{}'));
} catch (e) { tblState = { rows: {}, del: {}, pages: {}, seq: 0 }; }
function saveTbl() {
  try { localStorage.setItem(TBL_KEY, JSON.stringify(tblState)); } catch (err) {}
}
function tblRowsSt(tid) {
  if (!tblState.rows[tid]) tblState.rows[tid] = { seq: 0, list: [] };
  return tblState.rows[tid];
}
function tblDel(tid) {
  if (!tblState.del[tid]) tblState.del[tid] = [];
  return tblState.del[tid];
}
function newXId() {
  tblState.seq = (tblState.seq || 0) + 1;
  return Date.now().toString(36) + tblState.seq;
}

/* 旧版轨迹增行数据一次性迁移到 TBL_KEY（含单元格 eid 改名） */
(function migrateTrack() {
  let old = null;
  try { old = JSON.parse(localStorage.getItem(LEGACY_TRACK_KEY) || 'null'); } catch (e) { old = null; }
  if (!old) return;
  let moved = false;
  Object.keys(old).forEach(no => {
    const ex = old[no];
    if (ex && ex.rows && ex.rows.length) {
      tblState.rows['c' + no + '-track-t'] =
        { seq: ex.seq || ex.rows.length, list: ex.rows.map(r => ({ id: r.id, cells: r.cells })) };
      moved = true;
    }
  });
  if (moved) {
    Object.keys(edits).forEach(k => {
      const m = k.match(/^(.+)-ax-(\d+)-(\d+)$/);
      if (m && tblState.rows[m[1]]) { edits[m[1] + '-a' + m[2] + '-' + m[3]] = edits[k]; delete edits[k]; }
    });
    try { localStorage.setItem(EDIT_KEY, JSON.stringify(edits)); } catch (err) {}
    saveTbl();
  }
  try { localStorage.removeItem(LEGACY_TRACK_KEY); } catch (err) {}
})();

/* 2026-11-06 客户重编号一次性迁移：原14(中芯S1 8寸)并入12、原32(华力微)删除，其后序号前移。
   只迁移以客户 no 派生的键（meta/ov/h/占位表）；数据内 authored 表 id（c15-s8-b1 等）不变故不迁移。 */
(function migrateRenumber() {
  let done = null;
  try { done = localStorage.getItem('booklet-map-v2'); } catch (e) {}
  if (done) return;
  function mapNo(s) {
    const n = parseInt(s, 10);
    if (isNaN(n)) return null;
    if (n === 14 || n === 32) return null;   // 已并入/已删除
    return String(n > 32 ? n - 2 : (n > 14 ? n - 1 : n)).padStart(2, '0');
  }
  function remapKey(k) {
    let m = k.match(/^ov-(\d+)-([\s\S]*)$/);
    if (m) { const n = mapNo(m[1]); return n ? 'ov-' + n + '-' + m[2] : null; }
    m = k.match(/^h-(\d+)-([\s\S]*)$/);
    if (m) { const n = mapNo(m[1]); return n ? 'h-' + n + '-' + m[2] : null; }

    if (m) { const n = mapNo(m[1]); return n ? 'c' + n + '-meta-' + m[2] : null; }

/* ============ 文本处理 ============ */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
const MK = /(🌐|🔴|🔥|⚠️|⏸|✅|❌|★|→)/g;
function inline(t) {
  let s = esc(t);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(MK, '<span class="mk">$1</span>');
  return s;
}
function tierColor(t) { return (DATA.tiers[t] || {}).color || '#808080'; }

/* ============ 每日全网追新数据层（news-data.js 提供，缺失则静默降级） ============ */
const NEWS = (typeof window.NEWS_DATA === 'object' && window.NEWS_DATA && window.NEWS_DATA.items) ? window.NEWS_DATA : null;
const NEWS_TAG_COLOR = { '商机': '#C00000', '扩产': '#C00000', '业绩': '#2E5496', '政策': '#C55A11', '风险': '#C55A11', '价格': '#1E7B34', '人事': '#808080', '订单': '#C00000', '技术': '#2E5496', '动态': '#2E5496' };
function newsTagColor(t) { return NEWS_TAG_COLOR[t] || '#2E5496'; }
function newsFresh(d) {
  if (!d) return false;
  const dd = parseDate(d);
  if (!dd) return false;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return (today - dd) / 86400000 <= 3;
}
function newsOf(no) {
  if (!NEWS) return [];
  return NEWS.items.filter(n => String(n.no) === String(no));
}
function newsHtml(n) {
  const fresh = newsFresh(n.date);
  return (fresh ? '<span class="n-fresh">新</span>' : '') +
    '<span class="n-date">' + esc(n.date || '') + '</span>' +
    '<span class="n-tag" style="background:' + newsTagColor(n.tag) + '">' + esc(n.tag || '动态') + '</span>' +
    '<span class="n-tt">' + inline(n.title || '') + '</span>' +
    '<span class="n-src">' + (n.url ? '<a href="' + esc(n.url) + '" target="_blank" rel="noopener" title="点击溯源原文">🔗 ' + esc(n.source || '溯源') + '</a>' : esc(n.source || '')) + '</span>' +
    (n.summary ? '<div class="n-sum">' + inline(n.summary) + '</div>' : '');
}

/* ============ 统一模板归一化：每家客户固定四个类目页 ============ */
/* 1 公司背景简介 / 2 需求与上机 / 3 联系人 / 4 跟进轨迹
   「核心风险 / 下一步行动」不再成页；缺联系人或跟进轨迹都补固定占位表；单页排不下自动「续页」 */
const TRACK_HEAD = ['日期', '方式', '跟进内容', '下一步'];
const CONTACT_HEAD = ['姓名', '职位 / 角色', '层级', '状态', '电话', '邮箱', '异常标注'];
const CATS = [
  { no: '一', name: '公司背景简介', keys: ['一句话画像', '公司背景'] },
  { no: '二', name: '需求与上机', keys: ['需求与商机', '需求'] },
  { no: '三', name: '联系人', keys: ['联系人'] },
  { no: '四', name: '跟进轨迹', keys: ['跟进轨迹'] }
];
function catIndexOf(title) {
  for (let i = 0; i < CATS.length; i++) {
    for (let k = 0; k < CATS[i].keys.length; k++) {
      if (title.indexOf(CATS[i].keys[k]) >= 0) return i;
    }
  }
  return -1;
}
function cleanSecTitle(t) {
  return String(t || '')
    .replace(/^[一二三四五六七八九十]+、/, '')
    .replace(/（[^）]*）$/, '')
    .trim();
}
function normalizeClient(c) {
  const cats = CATS.map(cat => ({ cat: cat, sections: [] }));
  let source = null;
  (c.sections || []).forEach(sec => {
    const blocks = [];
    (sec.blocks || []).forEach(b => {
      if (b.k === 'source') source = b;   // 资料来源统一放到该客户最后一页页脚
      else blocks.push(b);
    });
    const i = catIndexOf(sec.title);
    if (i >= 0 && blocks.length) {
      cats[i].sections.push({ title: cleanSecTitle(sec.title), blocks: blocks });
    }
  });
  // 联系人：无记录或无表格的客户补统一固定空表，保证联系人页永远有表格
  const contactCat = cats[2];
  const hasContactTbl = contactCat.sections.some(s => s.blocks.some(b => b.k === 'table'));
  if (!hasContactTbl) {
    contactCat.sections.push({
      title: contactCat.sections.length ? '联系人（补）' : '联系人',
      blocks: [{ k: 'table', id: 'c' + c.no + '-contact-t', head: CONTACT_HEAD,
                 rows: [['—', '—', '—', '🔴 台账暂无联系人记录，待补充', '—', '—', '—']] }]
    });
  }
  // 跟进轨迹：无记录的客户补占位表，保证四页齐全
  const trackCat = cats[3];
  if (!trackCat.sections.length) {
    trackCat.sections.push({
      title: '跟进轨迹',
      blocks: [{ k: 'table', id: 'c' + c.no + '-track-t', head: TRACK_HEAD,
                 rows: [['—', '—', '🔴 台账暂无跟进记录，待补充', '—']] }]
    });
    if (!source) {
      source = { k: 'source', id: 'c' + c.no + '-track-src',
                 text: '**资料来源**：《客户信息总表（' + DATA.date + ' 更新版）》— 客户台账 / 跟进记录；暂无跟进记录，待补充。' };
    }
  }
  // 全网追新动态：注入类目一末尾（数据由 news-data.js 提供；标🔴为台账缺失之外，追新条目均附溯源链接）
  if (cats[0].sections.length) {
    const its = newsOf(c.no);
    if (its.length) {
      cats[0].sections.push({
        title: '🌐 全网追新动态（每日自动检索）',
        blocks: [{ k: 'news', id: 'c' + c.no + '-news', items: its }]
      });
    }
  }
  return { cats: cats, source: source };
}

/* ============ 块渲染 ============ */
function buildBlock(b, firstInSection) {
  const wrap = document.createElement('div');
  wrap.className = 'blk';
  wrap.dataset.eid = b.id;
  if (b.k === 'p') {
    wrap.innerHTML = inline(b.text);
  } else if (b.k === 'callout') {
    wrap.className = 'blk callout';
    wrap.innerHTML = inline(b.text);
  } else if (b.k === 'source') {
    wrap.className = 'src';
    wrap.dataset.eid = b.id;
    wrap.innerHTML = inline(b.text);
  } else if (b.k === 'quote') {
    wrap.className = 'blk';
    wrap.innerHTML = '<blockquote class="qt">' + b.items.map(x => inline(x)).join('<br>') + '</blockquote>';
  } else if (b.k === 'ul' || b.k === 'ol') {
    const tag = b.k;
    wrap.innerHTML = '<' + tag + '>' + b.items.map((x, i) =>
      '<li data-eid="' + b.id + '-i' + i + '">' + inline(x) + '</li>').join('') + '</' + tag + '>';
    wrap.dataset.eid = b.id;
  } else if (b.k === 'table') {
    const cols = b.head.length;
    wrap.className = 'blk';
    wrap.dataset.eid = b.id;
    let html = '<table class="tbl" data-cols="' + cols + '"><thead><tr>' +
      b.head.map(h => '<th>' + inline(h) + '</th>').join('') + '</tr></thead><tbody>';
    b.rows.forEach((r, ri) => {
      html += '<tr>' + r.map((c, ci) =>
        '<td data-eid="' + b.id + '-r' + ri + '-' + ci + '">' + inline(c) + '</td>').join('') + '</tr>';
    });
    wrap.innerHTML = html + '</tbody></table>';
  } else if (b.k === 'news') {
    wrap.className = 'blk';
    wrap.innerHTML = b.items.map(n => '<div class="news-item' + (newsFresh(n.date) ? ' fresh' : '') + '">' + newsHtml(n) + '</div>').join('');
  } else {
    wrap.innerHTML = inline(b.text || '');
  }
  return wrap;
}

function buildSection(sec, isFirst) {
  const h = document.createElement('div');
  h.className = 'sec-title' + (isFirst ? ' first' : '');
  h.dataset.eid = 'h-' + sec.blocks[0].id;
  h.textContent = sec.title;
  return h;
}

/* ============ 单位拆解（标题 + 首块绑定，避免孤行） ============ */
function buildUnits(sections) {
  const units = [];
  sections.forEach((sec, si) => {
    const head = buildSection(sec, si === 0);
    const blocks = sec.blocks.map(b => buildBlock(b, false));
    if (!blocks.length) return;
    const g = document.createElement('div');
    g.className = 'blk-group';
    g.appendChild(head);
    g.appendChild(blocks[0]);
    units.push({ el: g, isFirst: si === 0 });
    for (let i = 1; i < blocks.length; i++) units.push({ el: blocks[i] });
  });
  return units;
}

function custStrip(c, ci, xpid) {

function catTitleEl(c, cat, ci, cont) {

  h.className = 'sec-title first';

function paginateClients() {
  const pages = [];
  DATA.clients.forEach(c => {
    const norm = normalizeClient(c);
    norm.cats.forEach((cat, ci) => buildCatPages(c, cat, ci, pages));
    // 资料来源统一放该客户最后一页页脚；放不下则单独一页
    if (norm.source) {
      const last = pages[pages.length - 1];
      const srcEl = buildBlock(norm.source, false);
      last.el._flow.appendChild(srcEl);
      if (flowHeight(last.el) > BODY_H - 6) {
        last.el._flow.removeChild(srcEl);
        const page = makeShell('client', c, {
          headLeft: '　—— ' + c.name + ' · 资料来源',
          headRight: '第 ' + c.no + ' 家 / 共 ' + DATA.clients.length + ' 家 · 附'
        });
        page._flow.appendChild(custStrip(c, 3));
        page._flow.appendChild(srcEl);
        book.appendChild(page);
        pages.push({ el: page, client: c, cat: 3 });
      }

  });
  return pages;
}

/* 普通类目页：流式填充，超出即「续页」；表格逐行检测，写满自动续表 */
function buildCatPages(c, cat, ci, pages) {
  const LIMIT = BODY_H - 6;
  const ROWLIM = LIMIT - toolsHeight();   // 表格页末尾要留出工具条的位置
  let cont = 0, page = null, n = 0;

  function newPage() {
    page = makeShell('client', c, {
      headLeft: '　—— ' + c.name + ' · ' + cat.cat.name + (cont ? '（续 ' + cont + '）' : ''),
      headRight: '第 ' + c.no + ' 家 / 共 ' + DATA.clients.length + ' 家 · 类目 ' + (ci + 1) + '/4'
    });
    page._flow.appendChild((ci === 0 && cont === 0) ? custBanner(c) : custStrip(c, ci));
    page._flow.appendChild(catTitleEl(c, cat.cat, ci, cont));
    book.appendChild(page);   // 立即挂入文档，才能取到真实布局
    pages.push({ el: page, client: c, cat: ci });
    n = 0;
  }
  function put(el) {
    page._flow.appendChild(el);
    if (n > 0 && flowHeight(page) > LIMIT) {
      page._flow.removeChild(el);
      cont++; newPage();
      page._flow.appendChild(el);
    }
    n++;
  }
  function putTable(b) {
    const rows = tblRowsOf(b);
    const mkTbl = () => {                      // 跟进轨迹类目（四）的表格打标记，供 7 日提醒同步
      const t = newTblEl(b);
      if (ci === 3) t.dataset.track = c.no;
      return t;
    };
    let t = mkTbl();
    page._flow.appendChild(t);
    let start = 0;
    if (rows.length) { t.tBodies[0].appendChild(rowEl(b, rows[0])); start = 1; }
    if (n > 0 && flowHeight(page) > LIMIT) {
      // 当前页放不下「表头+首行」→ 整表挪到新页
      page._flow.removeChild(t);
      cont++; newPage();
      t = mkTbl();
      page._flow.appendChild(t);
      if (rows.length) t.tBodies[0].appendChild(rowEl(b, rows[0]));
    }
    for (let ri = start; ri < rows.length; ri++) {
      const tr = rowEl(b, rows[ri]);
      t.tBodies[0].appendChild(tr);
      if (flowHeight(page) > ROWLIM) {
        t.tBodies[0].removeChild(tr);
        cont++; newPage();
        t = mkTbl();
        page._flow.appendChild(t);
        t.tBodies[0].appendChild(tr);
      }
    }
    if (!rows.length) {
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = b.head.length;
      td.className = 'empty-hint';
      td.textContent = '（空表 · 点下方「＋ 行」开始填写）';
      tr.appendChild(td);
      t.tBodies[0].appendChild(tr);
    }
    const tl = tblToolsEl(c, ci, b);
    page._flow.appendChild(tl);
    if (n > 0 && flowHeight(page) > LIMIT) {
      page._flow.removeChild(tl);
      cont++; newPage();
      page._flow.appendChild(tblToolsEl(c, ci, b));
    }
    n++;
  }

  newPage();
  cat.sections.forEach((sec, si) => {
    let sub = null;
    if (si > 0) {
      sub = document.createElement('div');
      sub.className = 'sub-h';
      sub.textContent = sec.title;
    }
    sec.blocks.forEach((b, bi) => {
      if (b.k === 'table') {
        if (sub) { put(sub); sub = null; }
        putTable(b);
        return;
      }
      const el = buildBlock(b, false);
      if (sub && bi === 0) {
        const g = document.createElement('div');
        g.appendChild(sub); g.appendChild(el);
        put(g);
      } else put(el);
    });
  });

  // 用户附表页（空白 / 复制），挂在该类目之后
  (tblState.pages[c.no] || []).forEach(pg => {

/* 工具条高度（每张表格页末尾都要放） */
function toolsHeight() {
  if (toolsHeight._h != null) return toolsHeight._h;

  d.className = 'track-tools blk';
  d.style.cssText = 'position:absolute;left:-99999px;top:0;width:' + CONTENT_W + 'px;visibility:hidden;';

function isTrackTid(id) { return /-track-t$/.test(id); }
function newTblEl(b) {
  const t = document.createElement('table');
  t.className = 'tbl' + (isTrackTid(b.id) ? ' track-tbl' : '');

  t.dataset.tid = b.id;

  return t;

/* 行数据 = 原始行（剔除已删）+ 用户增行；key 稳定，删行/增行不串位 */
function tblRowsOf(b) {
  const st = tblState.rows[b.id] || { list: [] };
  const del = tblState.del[b.id] || [];
  const out = [];
  (b.rows || []).forEach((r, i) => {
    if (del.indexOf('o' + i) < 0) out.push({ key: 'o' + i, cells: r, kind: 'orig', i: i });
  });
  (st.list || []).forEach(r => out.push({ key: 'a' + r.id, cells: r.cells, kind: 'add', id: r.id }));
  return out;
}
function rowEl(b, rd) {
  const tr = document.createElement('tr');
  if (rd.kind === 'add') tr.className = 'add-row';
  const n = rd.cells.length;
  rd.cells.forEach((cell, ci) => {
    const td = document.createElement('td');
    if (rd.kind === 'add') {
      const span = document.createElement('span');
      span.className = 'cell';
      span.dataset.eid = b.id + '-a' + rd.id + '-' + ci;   // 增行单元格，始终可编辑
      span.setAttribute('contenteditable', 'true');
      span.innerHTML = inline(cell);
      td.appendChild(span);
    } else {
      td.dataset.eid = b.id + '-' + rd.key + '-' + ci;
      td.innerHTML = inline(cell);
    }
    if (ci === n - 1) {
      const dx = document.createElement('span');
      dx.className = 'delx';
      dx.dataset.delt = b.id;
      dx.dataset.delr = rd.key;
      dx.textContent = '×';
      dx.title = '删除此行';
      td.appendChild(dx);
    }
    tr.appendChild(td);
  });
  return tr;
}
function tblToolsEl(c, ci, b) {
  const delN = (tblState.del[b.id] || []).length;
  const tools = document.createElement('div');
  tools.className = 'track-tools blk';
  tools.innerHTML =

    '<button class="addrow-btn" data-tblpage="' + c.no + '|' + ci + '|' + b.id + '">＋ 空白表格页</button>' +
    '<button class="addrow-btn" data-cpypage="' + c.no + '|' + ci + '|' + b.id + '">⧉ 复制本表为新页</button>' +
    (delN ? '<button class="addrow-btn" data-undel="' + b.id + '">↺ 恢复已删 ' + delN + ' 行</button>' : '') +
    '<span class="addrow-hint">单元格可直接点击输入；写满自动续页，悬停行尾 × 删行</span>';
  return tools;
}
/* 取页面内容流真实高度（display:none 时无布局，需临时渲染） */
function flowHeight(pageEl) {
  const el = pageEl;
  el.style.display = 'block';
  el.style.visibility = 'hidden';
  const h = el._flow.scrollHeight;
  el.style.display = '';
  el.style.visibility = '';
  return h;
}
/* 用户附表页：空白表格页 / 复制生成的表格页（可跨多页续排） */
function buildExtraTblPage(c, cat, ci, pg, pages) {
  const LIMIT = BODY_H - 6;
  const ROWLIM = LIMIT - toolsHeight();
  const blk = { k: 'table', id: pg.tid, head: pg.head, rows: pg.rows || [] };
  let cont = 0, page = null, t = null;

  function newPage() {
    page = makeShell('client', c, {
      headLeft: '　—— ' + c.name + ' · ' + pg.title + '（附表）' + (cont ? '（续 ' + cont + '）' : ''),
      headRight: '第 ' + c.no + ' 家 / 共 ' + DATA.clients.length + ' 家 · 类目 ' + (ci + 1) + '/4'
    });
    page._flow.appendChild(custStrip(c, ci, pg.id));
    const h = catTitleEl(c, { no: cat.cat.no, name: pg.title + '（附表）' }, ci, 0);
    h.dataset.eid = 'h-xp-' + pg.id;
    page._flow.appendChild(h);
    t = newTblEl(blk);
    if (ci === 3) t.dataset.track = c.no;   // 轨迹附表页同样打标记
    page._flow.appendChild(t);
    book.appendChild(page);
    pages.push({ el: page, client: c, cat: ci });
    cont++;
  }

  newPage();
  const rows = tblRowsOf(blk);
  rows.forEach(rd => {
    const tr = rowEl(blk, rd);
    t.tBodies[0].appendChild(tr);
    if (flowHeight(page) > ROWLIM) {
      t.tBodies[0].removeChild(tr);
      newPage();
      t.tBodies[0].appendChild(tr);
    }
  });
  if (!rows.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = pg.head.length;
    td.className = 'empty-hint';
    td.textContent = '（空白表格页 · 点「＋ 行」开始填写）';
    tr.appendChild(td);
    t.tBodies[0].appendChild(tr);
  }
  page._flow.appendChild(tblToolsEl(c, ci, blk));
  if (flowHeight(page) > LIMIT) {
    page._flow.removeChild(page._flow.lastElementChild);
    newPage();
    page._flow.appendChild(tblToolsEl(c, ci, blk));
  }
}

/* ============ 组装 ============ */
function build() {
  book.innerHTML = '';
  PAGES.length = 0;

  const ovs = buildOverview();
  const content = paginateClients();

  const all = [...ovs, ...content.map(x => x.el)];
  all.forEach(el => book.appendChild(el));

  ovs.forEach(el => PAGES.push({ el, kind: 'overview' }));
  content.forEach(x => PAGES.push({ el: x.el, kind: 'client', client: x.client }));

  // 页码 + 客户起始页
  const total = PAGES.length;
  const firstPage = {};
  PAGES.forEach((pg, i) => {
    const pn = pg.el.querySelector('.pn');
    if (pn) pn.innerHTML = '<b>' + (i + 1) + '</b> / ' + total;
    if (pg.client && !firstPage[pg.client.no]) firstPage[pg.client.no] = i;
  });
  PAGES.forEach(pg => {
    pg.el.querySelectorAll('[data-pg]').forEach(s => {
      const no = s.dataset.pg;
      s.textContent = firstPage[no] != null ? firstPage[no] + 1 : '—';
    });
  });

  DATA._total = total;

  // 溢出兜底：按需缩放（zoom 不改变元素自身 scrollHeight 口径，直接按比例一次设定）
  PAGES.forEach(pg => {

    if (!el._flow) return;
    el.style.display = 'block';
    el.style.visibility = 'hidden';

    el.style.display = '';
    el.style.visibility = '';
    if (h > BODY_H + 2) {
      el._flow.style.zoom = Math.max(0.72, (BODY_H - 2) / h).toFixed(2);

  applyEdits();

  fillSlider();
  fit();
  show(0, true);
}

/* ============ 主页总览表 + 7日跟进提醒 ============ */
function stripHtml(s) {
  return String(s == null ? '' : s)
    .replace(/<[^>]*>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').trim();
}
function parseDate(s) {
  const m = stripHtml(s).match(/(20\d{2})\s*[.\/\-年]\s*(\d{1,2})\s*[.\/\-月]\s*(\d{1,2})/);
  if (!m) return null;
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return isNaN(d) ? null : d;
}
/* 生效值：优先取用户修改（总览列 / 信息卡），否则取原始数据 */
function ovDays(c) {
  const ok = 'ov-' + c.no + '-lastFollow', mk = 'c' + c.no + '-meta-lastFollow';
  let raw = c.lastFollow;
  if (edits[ok] != null) raw = edits[ok];
  else if (edits[mk] != null) raw = edits[mk];
  return parseDate(raw);
}
/* ---- 跟进轨迹最新日期 ⇄ 主页最近跟进 / 7日提醒 同步 ---- */
function fmtDate(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
/* 轨迹里最近一次"已发生"的跟进日（≤今天）；没有才取最早的未来计划日 */
function trackLatest(no) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  let past = null, future = null;
  book.querySelectorAll('table[data-track="' + no + '"]').forEach(t => {
    t.querySelectorAll('tbody tr').forEach(tr => {
      const td = tr.querySelector('td');
      if (!td) return;
      const d = parseDate(td.textContent);
      if (!d) return;
      if (d <= today) { if (!past || d > past) past = d; }
      else if (!future || d < future) future = d;
    });
  });
  return past || future;
}
/* 轨迹日期为权威来源：无条件写回主页总览列 + 客户信息卡（修正误写日期、防卡死） */
function syncTrackFor(c) {
  const t = trackLatest(c.no);
  if (!t) return false;
  const ok = 'ov-' + c.no + '-lastFollow', mk = 'c' + c.no + '-meta-lastFollow';
  const cur = parseDate(edits[ok] != null ? edits[ok] : (edits[mk] != null ? edits[mk] : c.lastFollow));
  if (cur && cur.getTime() === t.getTime()) return false;
  const s = fmtDate(t);
  copyEdits(ok, s);
  copyEdits(mk, s);
  return true;
}
function syncAllTrackDates() {
  let n = 0;
  (DATA.clients || []).forEach(c => { if (syncTrackFor(c)) n++; });
  if (n) { try { localStorage.setItem(EDIT_KEY, JSON.stringify(edits)); } catch (err) {} }
  return n;
}
function ovInit(c, f) {
  const ok = 'ov-' + c.no + '-' + f, mk = 'c' + c.no + '-meta-' + f;
  if (edits[ok] != null) return edits[ok];
  if (edits[mk] != null) return edits[mk];
  return inline(c[f] || '—');
}
/* 双向同步：总览列 ⇄ 客户首页信息卡 */
function copyEdits(targetK, html) {
  const el = book.querySelector('[data-eid="' + cssEsc(targetK) + '"]');
  if (el && el !== document.activeElement && el.innerHTML !== html) el.innerHTML = html;
  if (edits[targetK] !== html) edits[targetK] = html;
}
function syncPair(k) {
  let m = k.match(/^c(\d+)-meta-(type|status|lastFollow)$/);
  if (m) { copyEdits('ov-' + m[1] + '-' + m[2], edits[k]); return; }
  m = k.match(/^ov-(\d+)-(type|status|lastFollow)$/);
  if (m) { copyEdits('c' + m[1] + '-meta-' + m[2], edits[k]); }
}
function ovRow(c) {
  const tr = document.createElement('tr');
  tr.dataset.ovno = c.no;

/* 7日提醒：重算全部行的提醒状态 + 汇总 + 工具条徽标 */
let REM_OVERDUE = 0;
function updateReminders() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  let overdue = 0;
  book.querySelectorAll('tr[data-ovno]').forEach(tr => {
    const c = (DATA.clients || []).find(x => x.no === tr.dataset.ovno);
    const cell = tr.querySelector('.ov-rem');
    if (!c || !cell) return;
    tr.classList.remove('due-red');
    const d = ovDays(c);
    if (!d) { cell.innerHTML = '<span class="rem-gray">— 无日期</span>'; return; }
    const days = Math.round((today - d) / 86400000);
    if (days < 0) { cell.innerHTML = '<span class="rem-blue">' + (-days) + ' 天后跟进</span>'; }
    else if (days > 7) { overdue++; tr.classList.add('due-red'); cell.innerHTML = '<span class="rem-red">⚠️ 已超 ' + days + ' 天</span>'; }
    else if (days === 0) { cell.innerHTML = '<span class="rem-ok">✅ 今日已跟进</span>'; }
    else { cell.innerHTML = '<span class="rem-ok">✅ ' + days + ' 天前</span>'; }
  });
  REM_OVERDUE = overdue;
  const sum = book.querySelector('.ov-sum');
  if (sum) sum.innerHTML = '共 ' + DATA.clients.length + ' 家 · <span class="rem-red">⚠️ ' + overdue +
    ' 家超 7 天未跟进</span> · 点客户名跳转画像；跟进轨迹最新日期自动同步到最近跟进与提醒';
  const b = $('#btnRem');
  if (b) b.innerHTML = '🔔 提醒' + (overdue ? '<span class="rem-badge">' + overdue + '</span>' : '');
}
function buildRemPanel() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const list = (DATA.clients || [])
    .map(c => ({ c: c, d: ovDays(c) }))
    .filter(x => x.d)
    .map(x => ({ c: x.c, days: Math.round((today - x.d) / 86400000) }))
    .filter(x => x.days > 7)

/* ============ 编辑 ============ */
function applyEdits() {
  const keys = Object.keys(edits);
  keys.forEach(k => {
    const el = book.querySelector('[data-eid="' + cssEsc(k) + '"]');
    if (el) el.innerHTML = edits[k];
  });
  applyStyles();
  updateEditFlag();
}
/* 整块级字体格式重建后回填 */
function applyStyles() {
  Object.keys(styles).forEach(k => {
    const el = book.querySelector('[data-eid="' + cssEsc(k) + '"]');
    if (!el) return;
    const st = styles[k] || {};
    if (st.fs) el.style.fontSize = st.fs;
    if (st.ff) el.style.fontFamily = st.ff;
    if (st.color) el.style.color = st.color;
    if (st.bg) el.style.background = st.bg;
    if (st.bold) el.style.fontWeight = '700';
  });
}
function cssEsc(s) { return String(s).replace(/(["\\])/g, '\\$1'); }

function setEditable(on) {
  book.querySelectorAll('[data-eid]').forEach(el => {
    if (el.classList.contains('toc-name')) return;
    if (el.classList.contains('cell') || el.classList.contains('editable-field')) { el.setAttribute('contenteditable', 'true'); return; } // 增行单元格与信息卡始终可编辑
    if (on) el.setAttribute('contenteditable', 'true');
    else el.removeAttribute('contenteditable');
  });
}

function bindEditCapture() {
  book.addEventListener('input', e => {
    const inCell = e.target.closest && (e.target.closest('.cell') || e.target.closest('.editable-field'));
    if (!editMode && !inCell) return;
    const el = e.target.closest('[data-eid]');
    if (!el) return;
    const k = el.dataset.eid;
    edits[k] = el.innerHTML;
    syncPair(k);
    const ttbl = el.closest('table[data-track]');            // 跟进轨迹表日期列（第1列）
    if (ttbl) {
      const ttd = el.closest('td');
      if (ttd && ttd.cellIndex === 0) {
        const tc = (DATA.clients || []).find(x => x.no === ttbl.dataset.track);
        if (tc) syncTrackFor(tc);
      }
    }
    clearTimeout(bindEditCapture._t);
    bindEditCapture._t = setTimeout(() => {
      try { localStorage.setItem(EDIT_KEY, JSON.stringify(edits)); } catch (err) {}
      updateEditFlag();
      updateReminders();
      // 内容变高可能溢出，实时兜底
      const pg = el.closest('.page');
      if (pg && pg._body && pg._body.scrollHeight > BODY_H + 2) {
        let k2 = parseFloat(pg._flow.style.zoom || 1);
        pg._flow.style.zoom = Math.max(0.72, k2 - 0.03).toFixed(2);
      }
    }, 420);
  }, true);
}

function updateEditFlag() {
  const n = Object.keys(edits).length;
  const f = $('#editFlag');
  if (editMode) f.innerHTML = '<i></i>编辑中' + (n ? ' · 已改 ' + n : '');
}

/* ============ 字体格式工具 ============ */
let lastFmtHost = null;
book.addEventListener('focusin', e => {
  if (e.target.isContentEditable) {
    const el = e.target.closest('[data-eid]');
    if (el) lastFmtHost = el;
  }
});
/* 当前格式操作目标：优先「选中文字」，否则「光标所在块 / 最近聚焦块」 */
function fmtTargets() {
  const sel = window.getSelection();
  if (sel && sel.rangeCount && !sel.isCollapsed) {
    const r = sel.getRangeAt(0);
    let sn = r.startContainer, en = r.endContainer;
    if (sn.nodeType === 3) sn = sn.parentElement;
    if (en.nodeType === 3) en = en.parentElement;
    const h1 = sn && sn.closest ? sn.closest('[data-eid]') : null;
    const h2 = en && en.closest ? en.closest('[data-eid]') : null;
    if (h1 && h1 === h2) return { kind: 'sel', sel: sel, host: h1 };
    if (h1 !== h2) return { kind: 'cross' };
  }
  const ae = document.activeElement;
  let host = (ae && ae.dataset && ae.dataset.eid) ? ae
    : (ae && ae.closest ? ae.closest('[data-eid]') : null);
  if (!host || !host.isContentEditable) host = (lastFmtHost && lastFmtHost.isConnected) ? lastFmtHost : null;
  return { kind: 'block', host: host };
}
/* 选中文字 → 包一层带内联样式的 span（随 edits 持久化） */
function wrapSel(css) {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount || sel.isCollapsed) return false;
  const range = sel.getRangeAt(0);
  const span = document.createElement('span');
  span.setAttribute('style', css);
  try {
    span.appendChild(range.extractContents());
    range.insertNode(span);
    const nr = document.createRange();
    nr.selectNodeContents(span);
    sel.removeAllRanges();
    sel.addRange(nr);
    return true;
  } catch (err) { return false; }
}
function unwrapSpans(root, range) {
  (root || book).querySelectorAll('span[style]').forEach(sp => {
    if (sp.classList.length || sp.id) return;          // 不动 emoji 等功能 span
    if (range && !range.intersectsNode(sp)) return;
    const parent = sp.parentNode;
    while (sp.firstChild) parent.insertBefore(sp.firstChild, sp);
    parent.removeChild(sp);
  });
}
/* 格式修改后：保存 edits + 同步 + 溢出兜底 */
function recordFmt(el) {
  if (!el || !el.dataset || !el.dataset.eid) return;
  const k = el.dataset.eid;
  edits[k] = el.innerHTML;
  syncPair(k);
  try { localStorage.setItem(EDIT_KEY, JSON.stringify(edits)); } catch (err) {}
  updateEditFlag();
  updateReminders();
  const pg = el.closest('.page');
  if (pg && pg._body && pg._body.scrollHeight > BODY_H + 2) {
    const k2 = parseFloat(pg._flow.style.zoom || 1);
    pg._flow.style.zoom = Math.max(0.72, k2 - 0.03).toFixed(2);
  }
}
function fmtApply(props) {
  const t = fmtTargets();
  if (t.kind === 'cross') { toast('一次只支持在同一个文本块内设置格式'); return; }
  if (t.kind === 'sel') {
    const css = Object.keys(props).map(p => p + ':' + props[p]).join(';');
    if (wrapSel(css)) { recordFmt(t.host); toast('已应用到所选文字'); }
    else toast('应用失败，请重新选中文字');
    return;
  }
  const host = t.host;
  if (!host) { toast('请先选中文字，或把光标放进要设置的文本块'); return; }
  Object.keys(props).forEach(p => { if (props[p]) host.style.setProperty(p, props[p]); });
  const k = host.dataset.eid;
  styles[k] = Object.assign({}, styles[k]);
  if (props['font-size']) styles[k].fs = props['font-size'];
  if (props['font-family']) styles[k].ff = props['font-family'];
  if (props['color']) styles[k].color = props['color'];
  if (props['background']) styles[k].bg = props['background'];
  if (props['font-weight']) styles[k].bold = true;
  saveStyles();
  recordFmt(host);
  toast('已应用到整个文本块（字号变更后页面会自动压缩防溢出）');
}
$('#fmtSize').onchange = e => { if (e.target.value) fmtApply({ 'font-size': e.target.value }); e.target.value = ''; };
$('#fmtFamily').onchange = e => { if (e.target.value) fmtApply({ 'font-family': e.target.value }); e.target.value = ''; };
$('#fmtColor').addEventListener('input', e => fmtApply({ 'color': e.target.value }));
$('#fmtBg').addEventListener('input', e => fmtApply({ 'background': e.target.value }));
$('#fmtBold').onclick = () => fmtApply({ 'font-weight': '700' });
$('#fmtClear').onclick = () => {
  const t = fmtTargets();
  if (t.kind === 'cross') { toast('一次只支持在同一个文本块内清除格式'); return; }
  if (t.kind === 'sel') {
    const r = t.sel.getRangeAt(0);
    unwrapSpans(t.host, r);
    recordFmt(t.host);
    toast('已清除所选文字的格式');
    return;
  }
  const host = t.host;
  if (!host) { toast('请先选中文字，或把光标放进要清除格式的文本块'); return; }
  host.style.removeProperty('font-size');
  host.style.removeProperty('font-family');
  host.style.removeProperty('color');
  host.style.removeProperty('background');
  host.style.removeProperty('font-weight');
  if (host.dataset.eid) { delete styles[host.dataset.eid]; saveStyles(); }
  unwrapSpans(host, null);
  recordFmt(host);
  toast('已清除该文本块的自定义格式');
};

/* ============ 翻页 ============ */
function show(i, instant) {
  idx = Math.max(0, Math.min(PAGES.length - 1, i));
  PAGES.forEach((pg, k) => {
    pg.el.classList.toggle('on', k === idx);
    if (instant) { pg.el.classList.remove('flip-out', 'flip-in'); }
  });
  const pgn = $('#pgn');
  pgn.textContent = (idx + 1) + ' / ' + PAGES.length;
  const sl = $('#slider');
  if (sl) sl.value = idx;
}

function goTo(i) {
  i = Math.max(0, Math.min(PAGES.length - 1, i));
  if (i === idx || animating) return;
  const dir = i > idx ? 1 : -1;
  const curEl = PAGES[idx].el;
  const nextEl = PAGES[i].el;

  animating = true;
  if (dir > 0) {
    nextEl.classList.add('on');          // 下一页先露出来，当前页盖在上面翻走
    curEl.classList.add('flip-out');
  } else {
    nextEl.classList.add('on', 'flip-in'); // 上一页从左侧翻回来盖住当前页
  }

  idx = i;
  $('#pgn').textContent = (i + 1) + ' / ' + PAGES.length;
  $('#slider').value = i;

  setTimeout(() => {
    curEl.classList.remove('flip-out');
    nextEl.classList.remove('flip-in');
    animating = false;
    show(i, true);
  }, 640);
}

const next = () => { if (!animating) goTo(idx + 1); };
const prev = () => { if (!animating) goTo(idx - 1); };

    (has ? '' : '\n\n（当前没有文字修改）'), '1');
  if (sel === '1') exportJson(true);

function exportJson(full) {
  let out;
  if (full) {
    const clone = JSON.parse(JSON.stringify(DATA));
    delete clone._first; delete clone._total;
    out = { meta: { exportedAt: new Date().toISOString(), version: 'v7-tables', edits: Object.keys(edits).length }, data: clone, edits, styles, tables: tblState };
  } else {
    out = { meta: { exportedAt: new Date().toISOString(), type: 'edits' }, edits, styles };
  }
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '客户画像册数据-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('已导出 JSON');
}

$('#fileIn').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const obj = JSON.parse(r.result);
      if (obj.data && obj.data.clients) {
        DATA.clients = obj.data.clients;
        DATA.title = obj.data.title || DATA.title;
        DATA.date = obj.data.date || DATA.date;
      }
      if (obj.edits) edits = obj.edits;
      if (obj.styles) { styles = obj.styles; saveStyles(); }
      if (obj.tables) { tblState = Object.assign({ rows: {}, del: {}, pages: {}, seq: 0 }, obj.tables); saveTbl(); }
      if (obj.track) {   // 旧版轨迹数据兼容
        Object.keys(obj.track).forEach(no => {
          const ex = obj.track[no];
          if (ex && ex.rows && ex.rows.length) {
            tblState.rows['c' + no + '-track-t'] =
              { seq: ex.seq || ex.rows.length, list: ex.rows.map(r => ({ id: r.id, cells: r.cells })) };
          }
        });
        saveTbl();
      }
      localStorage.setItem(EDIT_KEY, JSON.stringify(edits));
      build();
      toast('已导入：' + DATA.clients.length + ' 家 / 修改 ' + Object.keys(edits).length + ' 处');
    } catch (err) {
      alert('JSON 解析失败：' + err.message);
    }
  };
  r.readAsText(f);
  e.target.value = '';
};

document.addEventListener('keydown', e => {
  if (editMode && (e.target.isContentEditable)) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
  else if (e.key === 'Home') goTo(0);
  else if (e.key === 'End') goTo(PAGES.length - 1);
  else if (e.key === 'Escape' && editMode) $('#btnEdit').click();
});

});

// 全表格编辑：＋行 / ×删行 / 恢复已删 / ＋空白表格页 / ⧉复制本表为新页 / 删附表页
function lastTableOf(tid) {
  const list = book.querySelectorAll('table[data-tid="' + cssEsc(tid) + '"]');
  return list.length ? list[list.length - 1] : null;
}
function headOf(tid) {
  const t = lastTableOf(tid);
  if (!t) return ['项目', '内容'];
  return Array.from(t.querySelectorAll('thead th')).map(th => th.textContent.trim());
}
function rowsFromDom(tid) {
  const out = [];
  book.querySelectorAll('table[data-tid="' + cssEsc(tid) + '"]').forEach(t => {
    Array.from(t.tBodies[0].rows).forEach(tr => {
      if (tr.querySelector('td.empty-hint')) return;
      out.push(Array.from(tr.cells).map(td => {
        const cell = td.querySelector('.cell');
        return ((cell || td).innerText || '').replace(/×\s*$/, '').trim();
      }));
    });
  });
  return out;
}
function rebuildAt() {
  const cur = idx;
  build();
  show(Math.min(cur, PAGES.length - 1), true);
  setEditable(editMode);
}
function addExtraPage(cno, ci, tid, rows) {
  const cat = CATS[ci] || CATS[CATS.length - 1];
  if (!tblState.pages[cno]) tblState.pages[cno] = [];
  const id = newXId();
  tblState.pages[cno].push({
    id: id, ci: ci, title: cat.name,
    head: headOf(tid),
    rows: rows,
    tid: tid + '-x' + id
  });
  saveTbl();
  rebuildAt();
  toast(rows.length ? '已复制本表为新附表页（内容可继续编辑）' : '已新增空白表格页（点「＋ 行」开始填写）');
}
book.addEventListener('click', e => {
  const addBtn = e.target.closest('[data-addtrow]');
  if (addBtn) {
    const tid = addBtn.dataset.addtrow;
    const st = tblRowsSt(tid);
    st.seq = (st.seq || 0) + 1;
    st.list.push({ id: st.seq, cells: headOf(tid).map(() => '') });
    saveTbl();
    rebuildAt();
    toast('已新增一行：直接点击单元格输入，本页写满自动增页');
    return;
  }
  const undel = e.target.closest('[data-undel]');
  if (undel) {
    delete tblState.del[undel.dataset.undel];
    saveTbl();
    rebuildAt();
    toast('已恢复被删除的行');
    return;
  }
  const blankBtn = e.target.closest('[data-tblpage]');
  if (blankBtn) {
    const p = blankBtn.dataset.tblpage.split('|');
    addExtraPage(p[0], parseInt(p[1], 10), p[2], []);
    return;
  }
  const cpyBtn = e.target.closest('[data-cpypage]');
  if (cpyBtn) {
    const p = cpyBtn.dataset.cpypage.split('|');
    addExtraPage(p[0], parseInt(p[1], 10), p[2], rowsFromDom(p[2]));
    return;
  }
  const dx = e.target.closest('.delx');
  if (dx) {
    const tid = dx.dataset.delt, rk = dx.dataset.delr;
    if (tid && rk) {
      if (rk.charAt(0) === 'a') {
        const st = tblState.rows[tid];
        if (st) {
          const i = st.list.findIndex(r => String(r.id) === rk.slice(1));
          if (i >= 0) st.list.splice(i, 1);
        }
      } else {
        const dl = tblDel(tid);
        if (dl.indexOf(rk) < 0) dl.push(rk);
      }
      saveTbl();
      rebuildAt();
      toast('已删除该行（原始行可点「↺ 恢复已删行」找回）');
    }
    return;
  }
  const dp = e.target.closest('[data-delpage]');
  if (dp) {
    const p = dp.dataset.delpage.split('|');
    if (!confirm('删除此附表页及其全部内容？')) return;
    tblState.pages[p[0]] = (tblState.pages[p[0]] || []).filter(x => x.id !== p[1]);
    saveTbl();
    rebuildAt();
    toast('已删除附表页');
  }
});

/* 调试 / 预览：?p=12 直接打开该页；?debug=1 输出体检结果 */
(function () {
  const q = new URLSearchParams(location.search);
  const p = parseInt(q.get('p') || '0', 10);
  if (p > 0) setTimeout(() => show(Math.min(p - 1, PAGES.length - 1), true), 60);
  if (q.get('debug') === '1') {
    setTimeout(() => {
      const over = [];
      PAGES.forEach((pg, i) => {
        if (!pg.el._flow) return;
        const el = pg.el;
        el.style.display = 'block'; el.style.visibility = 'hidden';
        const h = el._flow.scrollHeight, w = el._flow.scrollWidth;
        el.style.display = ''; el.style.visibility = '';
        const zk = parseFloat(el._flow.style.zoom || '1');
        if (h * zk > BODY_H + 2) over.push({ p: i + 1, h: Math.round(h * zk), k: el._flow.style.zoom || 1 });
        if (w * zk > CONTENT_W + 2) over.push({ p: i + 1, w: Math.round(w * zk), kind: 'wide' });
      });
      const empty = [];
      PAGES.forEach((pg, i) => {
        if (pg.el._body && pg.el._flow.childElementCount === 0) empty.push(i + 1);
      });
      const tocMissing = [...book.querySelectorAll('[data-pg]')].filter(e => e.textContent === '—').length;
      const out = {
        pages: PAGES.length,
        clients: DATA.clients.length,
        firstPageSample: Object.entries(DATA._first).slice(0, 5),
        lastClientPage: DATA._first[DATA.clients[DATA.clients.length - 1].no] + 1,
        overflow: over.slice(0, 12),
        overflowCount: over.length,
        emptyPages: empty,
        tocMissing,
        scale: book.style.transform
      };
      const d = document.createElement('pre');
      d.id = 'selftest';
      d.style.cssText = 'position:fixed;left:0;top:0;z-index:9999;font-size:10px;background:#fff;padding:4px;display:none';
      d.textContent = JSON.stringify(out);
      document.body.appendChild(d);
    }, 400);
  }
})();

// 打印前展开全部页面
window.addEventListener('beforeprint', () => {
  PAGES.forEach(p => p.el.classList.add('on'));
});
